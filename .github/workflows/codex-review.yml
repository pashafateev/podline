name: Codex review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "*.png"
      - "**/*.png"
      - "*.jpg"
      - "**/*.jpg"
      - "*.jpeg"
      - "**/*.jpeg"
      - "*.gif"
      - "**/*.gif"
      - "*.webp"
      - "**/*.webp"
      - "*.avif"
      - "**/*.avif"
  issue_comment:
    types: [created]

jobs:
  codex:
    permissions:
      contents: read
      pull-requests: read
    uses: pashafateev/codex-workflows/.github/workflows/codex-review.yml@v1
    with:
      fallback_model: ${{ vars.CODEX_REVIEW_FALLBACK_MODEL }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
