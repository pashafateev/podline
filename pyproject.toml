[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podline"
version = "0.1.0"
description = "Local automation for the podline podcast workflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "boto3[crt]>=1.34,<2.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "moto[s3]>=5.0,<6.0",
  "pytest>=8.0",
]

[project.scripts]
pod = "podline.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
